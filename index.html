<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistant X — Powered by Pstar7</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: rgba(22, 27, 46, 0.85);
      --bg-input: #151b2e;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --bubble-ai: #1e2538;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; height: 100vh; overflow: hidden; }

    .chat-container {
      width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column;
      background: var(--bg-card); backdrop-filter: blur(12px); border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color);
    }

    /* Header */
    .header {
      padding: 16px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color); background: rgba(11, 15, 25, 0.6);
    }
    .profile-info { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem;
    }
    .header h2 { font-size: 1rem; font-weight: 600; }
    .status-text { font-size: 0.75rem; color: #10b981; }

    /* Button Trigger Modal */
    .model-selector-btn {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem;
      cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease;
    }
    .model-selector-btn:active { background: rgba(139, 92, 246, 0.25); }

    /* Messages */
    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .bubble { max-width: 82%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.45; word-wrap: break-word; }
    .user {
      background: linear-gradient(135deg, var(--accent-purple), #6d28d9);
      color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(109, 40, 217, 0.25);
    }
    .ai {
      background: var(--bubble-ai); color: var(--text-main); align-self: flex-start;
      border-bottom-left-radius: 4px; border: 1px solid var(--border-color);
    }

    /* Input */
    .input-box {
      padding: 14px; background: rgba(11, 15, 25, 0.8);
      border-top: 1px solid var(--border-color); display: flex; gap: 10px;
    }
    .input-box input {
      flex: 1; padding: 12px 16px; border-radius: 24px; background: var(--bg-input);
      border: 1px solid var(--border-color); color: var(--text-main); font-size: 0.95rem; outline: none;
    }
    .input-box input:focus { border-color: var(--accent-purple); }
    .input-box button {
      padding: 12px 20px; border-radius: 24px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      color: #ffffff; border: none; font-weight: 600; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; gap: 6px;
    }
    .input-box button:disabled { opacity: 0.5; }

    /* Custom Bottom-Sheet Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(6px);
      display: none; align-items: flex-end; justify-content: center; z-index: 100;
    }
    .modal-content {
      width: 100%; max-width: 480px; background: #131929; border-top: 1px solid var(--border-color);
      border-radius: 24px 24px 0 0; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px;
      animation: slideUp 0.25s ease-out forwards;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 1.05rem; font-weight: 600; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }

    .model-list { display: flex; flex-direction: column; gap: 10px; }
    .model-card {
      padding: 14px; border-radius: 14px; background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color); cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; transition: all 0.2s;
    }
    .model-card:hover { background: rgba(255, 255, 255, 0.06); }
    .model-card.active { border-color: var(--accent-cyan); background: rgba(6, 182, 212, 0.08); }
    .model-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
    .model-desc { font-size: 0.75rem; color: var(--text-muted); }
    .model-check { font-size: 1rem; color: var(--accent-cyan); display: none; }
    .model-card.active .model-check { display: block; }

    .card-icon {
      width: 36px; height: 36px; border-radius: 10px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: center;
      color: var(--accent-cyan); flex-shrink: 0;
    }
    .model-info-wrap { display: flex; align-items: center; gap: 12px; }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- Header -->
    <div class="header">
      <div class="profile-info">
        <div class="avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          </svg>
        </div>
        <div>
          <h2>Assistant X</h2>
          <span class="status-text">● Created by Pstar7</span>
        </div>
      </div>

      <!-- Tombol Pemilih Model -->
      <button class="model-selector-btn" id="openModalBtn">
        <span id="activeModelLabel">Gemini 3.8 Flash</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </div>

    <!-- Area Obrolan -->
    <div class="messages" id="messagesArea">
      <div class="bubble ai">Halo! Aku X, asisten buatan Pstar7. Ada yang mau kita diskusikan atau oprek kodenya bareng hari ini?</div>
    </div>

    <!-- Input Box -->
    <div class="input-box">
      <input type="text" id="userInput" placeholder="Ketik pesan atau tanya kode..." autocomplete="off" />
      <button id="sendBtn">
        <span>Kirim</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Custom Popup Modal Pemilihan Model -->
  <div class="modal-overlay" id="modelModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Pilih Mesin AI</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>

      <div class="model-list">
        <!-- 1. Gemini 3.8 Flash -->
        <div class="model-card active" data-model="gemini-3.8-flash" data-label="Gemini 3.8 Flash">
          <div class="model-info-wrap">
            <div class="card-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
              </svg>
            </div>
            <div>
              <div class="model-title">Gemini 3.8 Flash</div>
              <div class="model-desc">Rekomendasi resmi Google, respon kilat & stabil.</div>
            </div>
          </div>
          <div class="model-check">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
        </div>

        <!-- 2. Gemini 3.8 Pro -->
        <div class="model-card" data-model="gemini-3.8-pro" data-label="Gemini 3.8 Pro">
          <div class="model-info-wrap">
            <div class="card-icon" style="color: var(--accent-purple);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="16" height="16" x="4" y="4" rx="2"/>
                <path d="M9 20v2"/><path d="M15 20v2"/><path d="M9 2v2"/><path d="M15 2v2"/>
                <path d="M20 9h2"/><path d="M20 15h2"/><path d="M2 9h2"/><path d="M2 15h2"/>
              </svg>
            </div>
            <div>
              <div class="model-title">Gemini 3.8 Pro</div>
              <div class="model-desc">Penalaran tingkat tinggi untuk logika & coding rumit.</div>
            </div>
          </div>
          <div class="model-check">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPT DILETAKKAN LANGSUNG AGAR PASTI AKTIF -->
  <script>
    const API_KEY = "AQ.Ab8RN6I0B7yDicaB-aSx7fZA9K6sng6yqx4vtn9Tj72Fd9_XDQ";

    // Konfigurasi Kepribadian Assistant X
    const SYSTEM_PROMPT = `
Kamu adalah 'Assistant X' (biasa dipanggil 'X'), asisten AI yang dibuat dan dikembangkan oleh Pstar7.

Karakteristik & Kepribadian:
- Identitas: Nama lengkapmu adalah Assistant X, panggil dirimu 'X'. Pembuat/ownermu adalah Pstar7. Jika ditanya tentang asal-usul atau pembuatmu, selalu sebut Pstar7 dengan santai dan jelas.
- Sifat: Enjoy, ramah, kalem, tidak gegabah, serta tidak keras kepala (terbuka menerima koreksi dan masukan pengguna).
- Gaya Bicara: Santai, luwes, tidak kaku, menggunakan bahasa Indonesia kasual yang natural dan enak diajak ngobrol.
- Kemampuan Coding: Sangat solutif dan asyik diajak coding maupun diskusi teknis. Berikan penjelasan yang jelas, to-the-point, dan sertakan kode yang rapi saat membahas pemrograman.
- Sikap: Selalu suportif dan tenang saat membantu mencari solusi atau memecahkan error.
`;

    let currentModel = "gemini-3.8-flash";
    let chatHistory = [];

    // Inisialisasi Elemen
    const messagesArea = document.getElementById("messagesArea");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const modelModal = document.getElementById("modelModal");
    const openModalBtn = document.getElementById("openModalBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const activeModelLabel = document.getElementById("activeModelLabel");
    const modelCards = document.querySelectorAll(".model-card");

    // Event Buka / Tutup Modal
    openModalBtn.onclick = function() {
      modelModal.style.display = "flex";
    };

    closeModalBtn.onclick = function() {
      modelModal.style.display = "none";
    };

    modelModal.onclick = function(e) {
      if (e.target === modelModal) {
        modelModal.style.display = "none";
      }
    };

    // Event Pilih Model
    modelCards.forEach(function(card) {
      card.onclick = function() {
        currentModel = card.getAttribute("data-model");
        activeModelLabel.innerText = card.getAttribute("data-label");

        modelCards.forEach(c => c.classList.remove("active"));
        card.classList.add("active");

        modelModal.style.display = "none";
      };
    });

    // Event Kirim Pesan
    userInput.onkeypress = function(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    };

    sendBtn.onclick = function() {
      sendMessage();
    };

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendBubble(text, "user");
      userInput.value = "";
      sendBtn.disabled = true;

      chatHistory.push({ role: "user", parts: [{ text: text }] });

      const loadingBubble = appendBubble("Sedang mengetik...", "ai");
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${API_KEY}`;

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: chatHistory,
            generationConfig: { temperature: 0.7 }
          })
        });

        const data = await response.json();

        if (response.ok) {
          const aiReply = data.candidates[0].content.parts[0].text;
          loadingBubble.innerText = aiReply;
          chatHistory.push({ role: "model", parts: [{ text: aiReply }] });
        } else {
          loadingBubble.innerText = `Error (${response.status}): ${data.error?.message || "Gagal memproses"}`;
        }
      } catch (err) {
        loadingBubble.innerText = "Koneksi terputus. Silakan coba lagi.";
      } finally {
        sendBtn.disabled = false;
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }
    }

    function appendBubble(text, sender) {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${sender}`;
      bubble.innerText = text;
      messagesArea.appendChild(bubble);
      messagesArea.scrollTop = messagesArea.scrollHeight;
      return bubble;
    }
  </script>
</body>
</html>
